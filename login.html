<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin GaskeunFile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #0f172a;
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-100">
    <main class="grid min-h-screen place-items-center px-4 py-10">
      <div class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/95 p-8 shadow-2xl shadow-slate-950/40">
        <div class="mb-8 text-center">
          <p class="text-sm uppercase tracking-[0.2em] text-emerald-400">ADMIN LOGIN</p>
          <h1 class="mt-4 text-3xl font-bold text-white">Masuk ke Panel Admin</h1>
          <p class="mt-2 text-sm text-slate-400">Masukkan password admin untuk mengakses halaman kontrol.</p>
        </div>

        <form id="loginForm" class="space-y-6">
          <label class="block">
            <span class="text-sm font-semibold text-slate-200">Username</span>
            <input id="username" type="text" placeholder="" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" required />
          </label>
          <label class="block">
            <span class="text-sm font-semibold text-slate-200">Password</span>
            <input id="password" type="password" placeholder="" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" required />
          </label>

          <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-500">
            Masuk
          </button>

          <p id="loginMessage" class="text-sm text-center text-rose-400 hidden"></p>
        </form>
      </div>
    </main>

    <script>
      const ADMIN_USERNAME = 'Gas';
      const ADMIN_PASSWORD = 'Gas@admin1210';
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginMessage = document.getElementById('loginMessage');
      const AUTH_KEY = 'gaskeunfile_is_logged_in';

      function setLoggedIn() {
        localStorage.setItem(AUTH_KEY, 'true');
      }

      function showError(message) {
        loginMessage.textContent = message;
        loginMessage.classList.remove('hidden');
      }

      loginForm.addEventListener('submit', event => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
          setLoggedIn();
          window.location.href = 'admin.html';
        } else {
          showError('Username atau password salah. Coba lagi.');
        }
      });

      if (localStorage.getItem(AUTH_KEY) === 'true') {
        window.location.href = 'admin.html';
      }
    </script>
  </body>
</html>
